<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>enclip</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

    <!-- 엑셀(.xlsx) 내보내기용 ExcelJS (테두리/배경색 등 셀 스타일링 지원) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAgzCdilUEDqjh3vFrCiD1ylz-NbtOiwzE",
        authDomain: "enclip-13188.firebaseapp.com",
        projectId: "enclip-13188",
        storageBucket: "enclip-13188.firebasestorage.app",
        messagingSenderId: "662237406345",
        appId: "1:662237406345:web:157b27c8e84a640d70d258"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window._db = db;
      window._doc = doc;
      window._getDoc = getDoc;
      window._setDoc = setDoc;

      // Firebase 준비 완료 신호
      window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
      /* 초기 로딩 */
      #firebase-loading {
          position: fixed; top: 0; left: 0; right: 0; bottom: 0;
          background: #FAF9F6; display: flex; flex-direction: column;
          align-items: center; justify-content: center; z-index: 9999; gap: 16px;
          transition: opacity 0.4s;
      }
      #firebase-loading.hide { opacity: 0; pointer-events: none; }
      #firebase-loading .spinner {
          width: 36px; height: 36px; border: 3px solid #f2f2f7;
          border-top-color: #FF7F50; border-radius: 50%;
          animation: spin 0.8s linear infinite;
      }
      #firebase-loading p { color: #8E8E93; font-size: 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }

      :root {
        --primary-color: #FF7F50;
        --bg-color: #FAF9F6; 
        --card-bg: #ffffff;
        --text-main: #1C1C1E; /* iOS System Dark Text */
        --text-sub: #8E8E93;  /* iOS System Gray */
        --app-font: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --english-font: "IBM Plex Sans", sans-serif;
      }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--app-font); -webkit-tap-highlight-color: transparent; }
        body { background-color: #EFEFEA; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 500px; background: var(--bg-color); min-height: 100vh; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 25px rgba(0,0,0,0.04); padding-bottom: 90px; }
        
        
        /* 탭 화면 제어 */
        .tab-content { display: none; padding: 20px; flex: 1; }
        .tab-content.active { display: flex; flex-direction: column; }
        #tab-flashcard.active { display: flex; flex-direction: column; padding-bottom: 20px; }
        #tab-flashcard .flashcard-area { flex: 1; }
        
        .dashboard-grid { 
            display: flex; 
            gap: 22px; 
            margin-bottom: 20px; 
        }
        /* 노션 스타일 탭: 배경/테두리 없이 선택된 것만 밑줄 표시 */
        .dash-card { 
            background: transparent; 
            border: none;
            border-bottom: 2px solid transparent;
            border-radius: 0; 
            padding: 2px 0 9px; 
            text-align: left; 
            cursor: pointer; 
            transition: border-color 0.2s; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            gap: 6px;
            box-shadow: none;
        }
        .dash-card:active {
            transform: none;
            background-color: transparent;
        }
        .dash-card.active { 
            border-bottom-color: var(--primary-color); 
            background: transparent;
            box-shadow: none;
        }
        .dash-card-label { 
            font-size: 14px; 
            font-weight: 600; 
            color: #9b9a97; 
            margin-bottom: 0;
        }
        .dash-card.active .dash-card-label { 
            color: var(--text-main); 
            font-weight: 700;
        }
        .dash-card-badge { 
            display: inline-block; 
            background: transparent; 
            color: #c4c3bf; 
            padding: 0; 
            border-radius: 0; 
            font-size: 12px; 
            font-weight: 700; 
            transition: color 0.2s;
        }
        .dash-card.active .dash-card-badge {
            background: transparent;
            color: var(--primary-color);
        }
        
        .search-box { position: relative; margin-bottom: 22px; border-bottom: 1px solid #eeece9; padding-bottom: 10px; }
        .search-box input { width: 100%; padding: 2px 4px 2px 24px; border: none; border-radius: 0; font-size: 14px; background: transparent; outline: none; color: var(--text-main); }
        .search-box input:focus { border-color: transparent; }
        .search-box i { position: absolute; left: 2px; top: 3px; color: var(--text-sub); font-size: 13px; }

        /* 문장 리스트 - 노션 스타일 (박스 없이 여백/구분선으로만 구분) */
        #word-list-container { border-top: 1px solid #eeece9; }
        .sentence-row { padding: 16px 4px; border-bottom: 1px solid #eeece9; }
        .sentence-row:last-child { border-bottom: none; }
        .sentence-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .sentence-text-wrap { flex: 1; min-width: 0; }
        .sentence-kr-row { display: flex; align-items: baseline; gap: 6px; }
        .sentence-kr { font-size: 16px; font-weight: 600; color: var(--text-main); line-height: 1.6; word-break: keep-all; }
        .sentence-en { font-size: 14px; font-weight: 400; color: var(--text-main); line-height: 1.6; margin-top: 3px; font-family: var(--english-font) !important; cursor: pointer; }
        .sentence-star { font-size: 11px; color: #e0a132; flex-shrink: 0; }
        .sentence-actions { display: flex; gap: 6px; flex-shrink: 0; margin-top: 1px; color: #c4c3bf; font-size: 13px; }
        .sentence-actions i { cursor: pointer; transition: color 0.15s; padding: 6px; }
        .sentence-actions i:hover { color: var(--primary-color); }

        .link-list { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
        .link-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-left: 14px; border-left: 2px solid #eeece9; }

        /* 검색 결과에서 일치하는 부분 하이라이트 */
        mark.search-highlight { background: #fdecc8; color: inherit; border-radius: 2px; padding: 0 1px; }

        .add-link-btn { color: var(--text-sub); font-size: 12px; cursor: pointer; font-weight: 500; display: inline-block; margin-top: 5px; transition: color 0.2s; }
        .add-link-btn:hover { color: var(--primary-color); }
        
        /* 하단 앱 네비게이션 바 */
        nav { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-top: 0.5px solid #d1d1d6; display: flex; justify-content: space-around; padding: 10px 0 14px; z-index: 10; }
        .nav-item { text-align: center; color: var(--text-sub); cursor: pointer; font-size: 11px; flex: 1; transition: color 0.2s; }
        .nav-item.active { color: var(--primary-color); }
        .nav-item i { font-size: 21px; margin-bottom: 4px; display: block; }
        
        /* 플로팅 액션 우측 버튼 (+) */
        .fab { position: fixed; right: calc(50% - 250px + 20px); bottom: 75px; width: 56px; height: 56px; background: var(--primary-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; cursor: pointer; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08); z-index: 20; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        @media (max-width: 500px) { .fab { right: 20px; } }
        .fab:active { transform: scale(0.9); }
        
        /* 공용 바텀시트 모달 팝업 구조 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; width: 90%; max-width: 440px; border-radius: 28px; padding: 28px 22px; animation: iosSpringIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); max-height: 85vh; overflow-y: auto; }
        @keyframes iosSpringIn { from { opacity: 0; transform: scale(0.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #48484a; }
        .form-group input { width: 100%; padding: 13px; border: 1px solid #eeece9; border-radius: 12px; background: #f7f6f3; font-size: 15px; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: var(--primary-color); background: #fff; }
        
        .modal-btns { display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap; }
        /* 일률적이고 깔끔한 그레이 톤으로 정렬된 iOS 알림형 버튼 가이드 적용 */
        .btn { flex: 1; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; text-align: center; min-width: 80px; transition: background-color 0.2s, transform 0.1s; }
        .btn:active { transform: scale(0.97); }
        .btn-cancel { background: #f7f6f3; color: #37352f; }
        .btn-cancel:hover { background: #eeece9; }
        .btn-submit { background: var(--primary-color); color: white; }

        /* 플래시카드 상단 진행 카운터 (예: 6 / 13) */
        .fc-progress-wrap { text-align: center; margin-bottom: 14px; }
        .fc-progress-wrap span { font-size: 14px; font-weight: 700; color: #9b9a97; letter-spacing: 0.3px; }

        /* 플래시카드 하단 컨트롤 (카테고리 / 셔플 / 발음 원형 버튼) - 홈 화면과 톤 통일 */
        .fc-control-bar { display: flex; gap: 14px; justify-content: center; margin-top: 22px; }
        .fc-icon-btn-wrap { position: relative; }

        .fc-icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #eeece9;
            background: #ffffff;
            color: #9b9a97;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fc-icon-btn:hover { color: var(--primary-color); border-color: var(--primary-color); }
        .fc-icon-btn:active { transform: scale(0.9); }
        .fc-icon-btn.flash { background: var(--primary-color); border-color: var(--primary-color); color: #fff; transform: scale(0.94); }

        /* 플래시카드 스와이프 채점 피드백 오버레이 */
        .fc-swipe-indicator { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; opacity: 0; pointer-events: none; transition: opacity 0.1s linear; z-index: 5; }
        .fc-swipe-indicator.right i { color: #34C759; }
        .fc-swipe-indicator.left i { color: #FF3B30; }

        .fc-count-btn { font-size: 12px; font-weight: 800; letter-spacing: 0.2px; }
        .fc-count-btn.selected { color: var(--primary-color); }

        /* 목록/개수 드롭다운 메뉴 */
        .fc-dropdown-menu {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.04);
            padding: 6px;
            min-width: 108px;
            z-index: 30;
        }
        .fc-dropdown-menu.show { display: block; animation: fcDropdownIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fcDropdownIn {
            from { opacity: 0; transform: translateX(-50%) scale(0.92) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
        }
        .fc-dropdown-item {
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #48484a;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s;
        }
        .fc-dropdown-item:hover { background: #f2f2f7; }
        .fc-dropdown-item.active { color: var(--primary-color); }

        /* 인라인 토스트 */
        .inline-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.88); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 24px; padding: 22px 30px; text-align: center; box-shadow: 0 12px 36px rgba(0,0,0,0.12); z-index: 9999; opacity: 0; transition: opacity 0.25s, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; min-width: 250px; }
        .inline-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .inline-toast .it-emoji { font-size: 32px; margin-bottom: 10px; display: block; }
        .inline-toast .it-msg { font-size: 15px; font-weight: bold; color: var(--text-main); line-height: 1.6; }

        /* 플래시카드 (정확히 반반으로 나뉜 2단 구조: 위-한국어 / 아래-영어) - 홈 화면과 톤을 맞춘 플랫한 스타일 */
        .flashcard-area {
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid #eeece9;
            border-radius: 14px;
            margin-bottom: 0;
            overflow: hidden;
            box-shadow: none;
            user-select: none;
            position: relative;
            min-height: 300px;
            touch-action: pan-y;
        }
        .fc-top-section {
            flex: 1 1 50%;
            background: #fff;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fc-bottom-section {
            flex: 1 1 50%;
            background: #fff;
            border-top: 1px solid #eeece9;
            padding: 30px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #fc-korean { font-size: 22px; font-weight: 700; color: var(--text-main); word-break: keep-all; line-height: 1.45; }
        #fc-english { font-size: 22px; font-weight: 700; color: var(--text-main); font-family: var(--english-font) !important; line-height: 1.45; word-break: normal; overflow-wrap: break-word; }

        /* 결과 창 패널 스타일 */
        .result-panel { text-align: center; padding: 20px 10px; }
        .result-score { font-size: 46px; font-weight: bold; color: var(--primary-color); margin: 15px 0; letter-spacing: -1px; }

        /* 설정 탭 섹션 - 노션 스타일 (박스 없이 구분선으로) */
        .settings-section { padding: 18px 4px; border-bottom: 1px solid #eeece9; }
        .settings-section:last-child { border-bottom: none; }
        .settings-section h3 { font-size: 12px; color: #9b9a97; margin-bottom: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
        .color-picker { display: flex; flex-wrap: wrap; gap: 15px; }
        .color-dot { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.2s; }
        .color-dot.active { border-color: #333; transform: scale(1.1); }

        /* 설정 탭 - 음성(TTS) 선택 (드롭다운 형식) */
        .voice-select-wrap { position: relative; }
        .voice-select-trigger {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 16px; border-radius: 12px; background: #f7f6f3;
            font-size: 15px; font-weight: 700; color: var(--text-main);
            cursor: pointer; transition: background-color 0.15s;
        }
        .voice-select-trigger:hover { background: #eeece9; }
        .voice-select-trigger i { color: var(--text-sub); font-size: 13px; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .voice-select-wrap.open .voice-select-trigger i { transform: rotate(180deg); }
        .voice-select-dropdown {
            display: none; position: absolute; top: calc(100% + 8px); left: 0; right: 0;
            background: #fff; border-radius: 16px; padding: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.04);
            z-index: 30;
        }
        .voice-select-dropdown.show { display: block; animation: voiceDropdownIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes voiceDropdownIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .voice-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-main); transition: background-color 0.15s; }
        .voice-item:hover { background: #f2f2f7; }
        .voice-item.active { color: var(--primary-color); background: rgba(255,127,80,0.08); }
        .voice-item i { color: var(--primary-color); }

        /* 설정 탭 - 재생 속도 슬라이더 */
        .speed-control-block { margin-top: 18px; }
        .speed-control-block.no-top-margin { margin-top: 0; }
        .speed-control-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
        .speed-control-header .speed-title { font-size: 13px; font-weight: 700; color: #48484a; }
        .speed-control-header .speed-value { font-size: 14px; font-weight: 800; color: var(--primary-color); }
        .speed-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 3px; background: #e5e5ea; outline: none; accent-color: var(--primary-color); }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary-color); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .speed-slider::-moz-range-thumb { width: 20px; height: 20px; border: none; border-radius: 50%; background: var(--primary-color); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .speed-tick-labels { display: flex; justify-content: space-between; margin-top: 6px; }
        .speed-tick-labels span { font-size: 10px; color: var(--text-sub); font-weight: 600; }
        
        
        /* 카테고리 아코디언 (홈화면) - 노션 스타일 */
        .category-section { margin-bottom: 2px; }
        .category-header { display: flex; align-items: center; gap: 6px; padding: 10px 6px; cursor: pointer; border-radius: 4px; }
        .category-header:hover { background: #f7f6f3; }
        .category-header-left { display: flex; align-items: center; gap: 6px; }
        .category-name { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .category-count { font-size: 12px; color: #c4c3bf; font-weight: 600; }
        .category-chevron { color: #9b9a97; font-size: 10px; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .category-section.open .category-chevron { transform: rotate(90deg); }
        .category-body { display: none; padding: 2px 0 6px 18px; border-top: 1px solid #eeece9; margin-top: 2px; }
        .category-section.open .category-body { display: block; }
        .category-empty-msg { text-align: center; color: var(--text-sub); font-size: 13px; padding: 20px 0; }

        /* 카드에 표시되는 카테고리 태그 (전체/오늘/즐겨찾기/검색 시) */
        .card-category-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--primary-color); background: rgba(255,127,80,0.1); padding: 3px 10px; border-radius: 10px; margin-bottom: 10px; }

        /* 설정 탭 - 카테고리 관리 */
        .cat-manage-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid #eeece9; }
        .cat-manage-row:last-child { border-bottom: none; }
        .cat-manage-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .cat-manage-name { font-size: 14px; font-weight: 700; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cat-manage-count { font-size: 12px; color: var(--text-sub); font-weight: 600; flex-shrink: 0; }
        .cat-manage-actions { display: flex; gap: 16px; color: var(--text-sub); font-size: 15px; flex-shrink: 0; }
        .cat-manage-actions i { cursor: pointer; }
        .cat-manage-actions i:hover { color: var(--primary-color); }
        .cat-manage-actions i.disabled { opacity: 0.25; pointer-events: none; }

        /* 플래시카드 - 카테고리 선택 팝업 (중앙 모달) */
        .fc-category-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--text-main); transition: background-color 0.15s; margin-bottom: 6px; }
        .fc-category-item:hover { background: #f2f2f7; }
        .fc-category-item.active { color: var(--primary-color); }
        .fc-category-item .fc-category-item-count { font-size: 12px; color: var(--text-sub); font-weight: 600; }
        .fc-category-item.active .fc-category-item-count { color: var(--primary-color); }

        /* 플래시카드 상단 현재 모드 라벨 */
        .fc-mode-label { font-size: 12px; font-weight: 700; color: var(--primary-color); letter-spacing: 0.2px; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="app-container">

</div>

<script>
    // ── 고정 문서 키 (이 앱의 데이터가 저장될 Firestore 경로) ──
    const FIRESTORE_DOC = 'my-enclip';
    const STORAGE_KEY = 'eng-note-words'; // 오프라인 폴백용

    function loadDataFromLocalStorage() {
        try {
            const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (Array.isArray(raw)) return { words: raw, categories: null }; // 구버전 포맷 호환
            if (raw && typeof raw === 'object') return { words: raw.words || [], categories: raw.categories || null };
            return { words: [], categories: null };
        } catch { return { words: [], categories: null }; }
    }

    async function loadDataFromFirebase() {
        try {
            const docRef = window._doc(window._db, 'enclip', FIRESTORE_DOC);
            const snap = await window._getDoc(docRef);
            if (snap.exists()) {
                const data = snap.data();
                return { words: data.words || [], categories: data.categories || null };
            }
            return { words: [], categories: null };
        } catch(e) {
            console.warn('Firebase 읽기 실패, 로컬 데이터 사용:', e);
            return loadDataFromLocalStorage();
        }
    }

    async function saveData() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ words: allWords, categories: allCategories })); } catch {}
        try {
            const docRef = window._doc(window._db, 'enclip', FIRESTORE_DOC);
            await window._setDoc(docRef, { words: allWords, categories: allCategories });
        } catch(e) {
            console.warn('Firebase 저장 실패, 로컬에만 저장됨:', e);
        }
        updateDashboardCounts();
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }
    function generateCategoryId() {
        return 'cat_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    // 본문장 1개 + 그 문장에 딸린 연결문장 개수를 합산한 카드 수 (대시보드 전체 카운트와 동일 기준)
    function cardCount(word) {
        return 1 + (word.links ? word.links.length : 0);
    }

    // 주어진 문장 배열 전체의 누적 카드 수 (본문장+연결문장 합산)
    function totalCardCount(words) {
        return words.reduce((sum, w) => sum + cardCount(w), 0);
    }

    function byNewest(a, b) { return new Date(b.createdAt) - new Date(a.createdAt); }

    function parseDate(createdAt) {
        if(!createdAt) return null;
        if(createdAt.toDate) return createdAt.toDate();
        return new Date(createdAt);
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    function escapeRegExp(str) {
        return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // 검색어와 일치하는 부분을 <mark>로 감싸서 하이라이트 (검색 결과 화면에서만 사용)
    function highlightMatch(text, term) {
        if(!term) return text;
        const re = new RegExp('(' + escapeRegExp(term) + ')', 'gi');
        return String(text).replace(re, '<mark class="search-highlight">$1</mark>');
    }

    let allWords = [];
    let allCategories = [{ id: 'default', name: '기본' }];
    let lastUsedCategoryId = 'default';

    let flashcardPool = [];
    let currentFlashIndex = 0;
    let isCardRevealed = false;
    let flashcardResults = {}; // { cardId: 'known' | 'unknown' } - 이번 학습 세션 동안의 체크/X 기록

    // 홈 화면 모드: 'category'(카테고리별 아코디언) | 'all' | 'today' | 'star'
    let currentHomeMode = 'category';
    let openCategoryIds = new Set(); // 펼쳐진 카테고리 상태 보존

    // 플래시카드 모드: {type:'scope', value:'all'|'today'|'star'} | {type:'category', id:categoryId}
    let fcMode = { type: 'scope', value: 'all' };

    // --- 시스템 초기화 세팅 (테마 컬러 및 폰트 불러오기) ---
    let savedColor = localStorage.getItem('eng-note-theme-color') || '#FF7F50';
    document.documentElement.style.setProperty('--primary-color', savedColor);
    document.querySelectorAll('.color-dot').forEach(dot => {
        if(dot.getAttribute('data-color') === savedColor) dot.classList.add('active');
        dot.addEventListener('click', () => {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            dot.classList.add('active');
            const targetColor = dot.getAttribute('data-color');
            document.documentElement.style.setProperty('--primary-color', targetColor);
            localStorage.setItem('eng-note-theme-color', targetColor);
        });
    });

    // 기존 데이터 마이그레이션: 카테고리가 없는 문장이나, 삭제된 카테고리를 가리키는 문장은
    // 남아있는 카테고리 중 첫 번째로 이동. 카테고리가 하나도 없으면 기본 카테고리 생성
    function ensureCategories() {
        let changed = false;
        if(!allCategories || allCategories.length === 0) {
            allCategories = [{ id: 'default', name: '기본' }];
            changed = true;
        }
        const fallbackId = allCategories[0].id;
        allWords.forEach(w => {
            if(!w.categoryId || !allCategories.some(c => c.id === w.categoryId)) {
                w.categoryId = fallbackId;
                changed = true;
            }
        });
        return changed;
    }

    function getCategoryName(id) {
        const c = allCategories.find(c => c.id === id);
        if(c) return c.name;
        return allCategories[0] ? allCategories[0].name : '';
    }

    function getCategoriesOrdered() {
        return allCategories.slice();
    }

    function updateDashboardCounts() {
        const words = allWords;
        const linkCount = words.reduce((sum, w) => sum + (w.links ? w.links.length : 0), 0);
        const allCount = words.length + linkCount;

        const todayStr = new Date().toDateString();
        const todayWords = words.filter(w => {
            if(!w.createdAt) return false;
            return parseDate(w.createdAt).toDateString() === todayStr;
        });
        const todayLinkCount = todayWords.reduce((sum, w) => sum + (w.links ? w.links.length : 0), 0);
        const todayCount = todayWords.length + todayLinkCount;

        const starCount = words.filter(w => w.starred === true).length
            + words.reduce((sum, w) => sum + (w.links ? w.links.filter(l => l.starred === true).length : 0), 0);

        document.getElementById('count-all').innerText = `(${allCount})`;
        document.getElementById('count-today').innerText = `(${todayCount})`;
        document.getElementById('count-star').innerText = `(${starCount})`;
    }

    // 대시보드 필터 칩 (전체 / 오늘 / 즐겨찾기) - 카테고리 상관없이 전체 문장을 대상으로 함
    function setActiveChip() {
        ['all','today','star'].forEach(id => {
            document.getElementById('chip-' + id).classList.toggle('active', currentHomeMode === id);
        });
    }

    document.getElementById('chip-all').addEventListener('click', () => {
        currentHomeMode = (currentHomeMode === 'all') ? 'category' : 'all';

    // TTS 음성 출력 엔진 (플랫폼별 최고 품질 음성 고정)
    // Android/Chrome → Google US English | iOS Safari → 시스템 기본 음성
    // Windows/Edge → 설정 탭에서 사용자가 고른 음성 (Jenny/Aria/Ava/Andrew/Guy) 우선 사용
    let _ttsVoice = null;
    const TTS_VOICE_STORAGE_KEY = 'eng-note-tts-voice-name';
    const TTS_RATE_STORAGE_KEY = 'eng-note-tts-rate';
    const TTS_RATE_DEFAULT = 0.95;
    const TTS_RATE_STEPS = ['0.90', '0.95', '1.00', '1.05', '1.10', '1.15', '1.20'];

    // 설정 탭에 노출할 음성 목록 (Edge/Windows 'Online (Natural)' 음성 기준)
    const TTS_VOICE_TARGETS = [
        { match: 'Jenny', label: 'Jenny' },
        { match: 'Aria', label: 'Aria' },
        { match: 'Ava', label: 'Ava' },
        { match: 'Andrew', label: 'Andrew' },
        { match: 'Guy', label: 'Guy' }
    ];

    function isIOSDevice() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }

    function getSavedTTSRate() {
        const saved = parseFloat(localStorage.getItem(TTS_RATE_STORAGE_KEY));
        if (!isNaN(saved) && saved >= 0.90 && saved <= 1.20) return saved;
        return TTS_RATE_DEFAULT;
    }

    function _loadTTSVoice() {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return;

        if (isIOSDevice()) {
            // iOS Safari: 시스템 기본 음성 사용 (기존 동작 그대로 유지)
            _ttsVoice = null;
        } else {
            // Windows/Edge 등: 사용자가 설정 탭에서 고른 음성이 있으면 우선 사용
            const savedVoiceName = localStorage.getItem(TTS_VOICE_STORAGE_KEY);
            const savedVoice = savedVoiceName ? voices.find(v => v.name === savedVoiceName) : null;

            _ttsVoice = savedVoice
                     || voices.find(v => v.name === 'Google US English')
                     || voices.find(v => v.name.includes('Google') && v.lang === 'en-US')
                     || voices.find(v => v.lang === 'en-US');
        }
    }

    // 설정 탭 - 음성 선택 드롭다운 렌더링 (iOS에서는 음성 선택 블록만 숨김, 속도 슬라이더는 계속 노출)
    function renderVoiceSettings() {
        const pickerBlock = document.getElementById('voice-picker-block');
        const listEl = document.getElementById('voice-list');
        const currentLabelEl = document.getElementById('voice-select-current');
        if (!pickerBlock || !listEl) return;

        if (isIOSDevice() || !window.speechSynthesis) {
            pickerBlock.style.display = 'none';
            return;
        }

        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) {
            pickerBlock.style.display = 'none';
            return;
        }

        const matched = [];
        TTS_VOICE_TARGETS.forEach(t => {
            const v = voices.find(v => v.name.includes(t.match) && v.lang && v.lang.startsWith('en'));
            if (v) matched.push({ voice: v, label: t.label });
        });

        if (matched.length === 0) {
            pickerBlock.style.display = 'none';
            return;
        }

        pickerBlock.style.display = 'block';
        const savedVoiceName = localStorage.getItem(TTS_VOICE_STORAGE_KEY);
        // 저장된 선택이 없으면 현재 적용 중인 음성을 기준으로 표시
        const activeName = savedVoiceName || (_ttsVoice ? _ttsVoice.name : null);
        const activeMatch = matched.find(m => m.voice.name === activeName);
        currentLabelEl.innerText = activeMatch ? activeMatch.label : matched[0].label;

        listEl.innerHTML = '';
        matched.forEach(m => {
            const isActive = activeName ? (activeName === m.voice.name) : (m === matched[0]);
            const item = document.createElement('div');
            item.className = 'voice-item' + (isActive ? ' active' : '');
            item.innerHTML = `<span>${escapeHtml(m.label)}</span>` + (isActive ? '<i class="fa-solid fa-check"></i>' : '');
            item.addEventListener('click', () => {
                localStorage.setItem(TTS_VOICE_STORAGE_KEY, m.voice.name);
                _ttsVoice = m.voice;
                closeVoiceDropdown();
                renderVoiceSettings();
            });
            listEl.appendChild(item);
        });
    }

    function closeVoiceDropdown() {
        const wrap = document.getElementById('voice-select-wrap');
        if (wrap) wrap.classList.remove('open');
        const dropdown = document.getElementById('voice-list');
        if (dropdown) dropdown.classList.remove('show');
    }

    document.getElementById('voice-select-trigger').addEventListener('click', (e) => {
        e.stopPropagation();
        const wrap = document.getElementById('voice-select-wrap');
        const dropdown = document.getElementById('voice-list');
        const wasOpen = dropdown.classList.contains('show');
        closeVoiceDropdown();
        if (!wasOpen) {
            wrap.classList.add('open');
            dropdown.classList.add('show');
        }
    });

    document.addEventListener('click', (e) => {
        const wrap = document.getElementById('voice-select-wrap');
        if (wrap && !wrap.contains(e.target)) closeVoiceDropdown();
    });

    // 설정 탭 - 재생 속도 슬라이더 (0.90 ~ 1.20, 0.05 단위 / 모든 플랫폼 공통)
    function renderSpeedControl() {
        const slider = document.getElementById('speed-slider');
        const label = document.getElementById('speed-value-label');
        if (!slider || !label) return;
        const rate = getSavedTTSRate();
        slider.value = rate.toFixed(2);
        label.innerText = rate.toFixed(2) + 'x';
    }

    const _speedSliderEl = document.getElementById('speed-slider');
    if (_speedSliderEl) {
        _speedSliderEl.addEventListener('input', () => {
            // 슬라이더 값은 0.05 단위 step이지만, 부동소수점 오차 보정을 위해 가장 가까운 지정값으로 스냅
            const raw = parseFloat(_speedSliderEl.value);
            let snapped = TTS_RATE_STEPS.map(Number).reduce((closest, v) =>
                Math.abs(v - raw) < Math.abs(closest - raw) ? v : closest
            );
            localStorage.setItem(TTS_RATE_STORAGE_KEY, snapped.toFixed(2));
            document.getElementById('speed-value-label').innerText = snapped.toFixed(2) + 'x';
        });
    }
    renderSpeedControl();

    // 음성 목록이 비동기로 로드되므로 이벤트 + 즉시 시도 둘 다 처리
    if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => { _loadTTSVoice(); renderVoiceSettings(); };
        _loadTTSVoice();
    }

    function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/\s*\/\s*/g, ' ').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        if (!_ttsVoice) _loadTTSVoice(); // 혹시 아직 로드 안 됐으면 재시도
        if (_ttsVoice) utterance.voice = _ttsVoice;
        utterance.rate = getSavedTTSRate();
        window.speechSynthesis.speak(utterance);
    }

    function refreshFromStorage() {
        renderHome();
        updateDashboardCounts();
        renderCategoryManageList();
        populateCategorySelects();
        populateExportCategorySelect();
    }

    // ── 홈 화면 렌더링 ──
    // 검색어가 있으면: 카테고리 상관없이 전체 문장에서 검색
    // 검색어가 없고 currentHomeMode==='category': 카테고리별 아코디언 표시
    // 검색어가 없고 all/today/star: 카테고리 상관없이 해당 조건의 전체 문장을 평면 리스트로 표시
    function renderHome() {
        setActiveChip();
        const searchValRaw = document.getElementById('search-input').value.trim();
        const searchVal = searchValRaw.toLowerCase();
        const flatContainer = document.getElementById('word-list-container');
        const accordionContainer = document.getElementById('category-accordion-container');

        if(searchVal) {
            accordionContainer.style.display = 'none';
            accordionContainer.innerHTML = '';
            flatContainer.style.display = 'block';
            const filtered = allWords.filter(w =>
                w.korean.toLowerCase().includes(searchVal) ||
                w.english.toLowerCase().includes(searchVal) ||
                (w.links || []).some(l =>
                    l.korean.toLowerCase().includes(searchVal) ||
                    l.english.toLowerCase().includes(searchVal)
                )
            ).sort(byNewest);
            renderWordList(filtered, flatContainer, false, false, searchValRaw);
            return;
        }

        if(currentHomeMode === 'category') {
            flatContainer.style.display = 'none';
            flatContainer.innerHTML = '';
            accordionContainer.style.display = 'block';
            renderCategoryAccordion();
            return;
        }

        accordionContainer.style.display = 'none';
        accordionContainer.innerHTML = '';
        flatContainer.style.display = 'block';

        let list;
        let starOnlyLinks = false;
        if(currentHomeMode === 'today') {
            const todayStr = new Date().toDateString();
            list = allWords.filter(w => w.createdAt && parseDate(w.createdAt).toDateString() === todayStr);
        } else if(currentHomeMode === 'star') {
            list = allWords.filter(w => w.starred === true || (w.links && w.links.some(l => l.starred === true)));
            starOnlyLinks = true;
        } else {
            list = [...allWords];
        }
        list.sort(byNewest);
        renderWordList(list, flatContainer, false, starOnlyLinks);
    }

    // 카테고리별 아코디언(드롭다운) 렌더링
    function renderCategoryAccordion() {
        const wrap = document.getElementById('category-accordion-container');
        wrap.innerHTML = '';

        if(allWords.length === 0) {
            wrap.innerHTML = `
                <div style="text-align:center; color:var(--text-sub); margin-top: 80px; font-size:14px; line-height:1.7;">
                    <div style="font-weight:700; color:var(--text-main); margin-bottom:6px;">아직 저장된 문장이 없어요</div>
                </div>`;
            return;
        }

        getCategoriesOrdered().forEach(cat => {
            const words = allWords.filter(w => w.categoryId === cat.id).sort(byNewest);
            const isOpen = openCategoryIds.has(cat.id);

            const section = document.createElement('div');
            section.className = 'category-section' + (isOpen ? ' open' : '');
            section.innerHTML = `
                <div class="category-header" data-cat="${cat.id}">
                    <i class="fa-solid fa-chevron-right category-chevron"></i>
                    <div class="category-header-left">
                        <span class="category-name">${escapeHtml(cat.name)}</span>
                        <span class="category-count">${totalCardCount(words)}</span>
                    </div>
                </div>
                <div class="category-body"></div>
            `;
            wrap.appendChild(section);

            const header = section.querySelector('.category-header');
            const body = section.querySelector('.category-body');

            if(isOpen) renderWordList(words, body, true);

            header.addEventListener('click', () => {
                const nowOpen = section.classList.contains('open');
                if(nowOpen) {
                    section.classList.remove('open');
                    openCategoryIds.delete(cat.id);
                    body.innerHTML = '';
                } else {
                    section.classList.add('open');
                    openCategoryIds.add(cat.id);
                    renderWordList(words, body, true);
                }
            });
        });
    }

    // 메인화면 리스트 동적 UI 렌더링
    // container: 렌더링할 대상 (기본: 홈 평면 리스트 컨테이너)
    // inCategoryContext: true면 카테고리 아코디언 내부용(카테고리 태그 숨김)
    // highlightTerm: 검색 결과 화면에서 일치하는 부분을 하이라이트할 검색어
    function renderWordList(words, container, inCategoryContext, starOnlyLinks, highlightTerm) {
        container = container || document.getElementById('word-list-container');
        container.innerHTML = '';

        if(words.length === 0) {
            if(inCategoryContext) {
                container.innerHTML = `<div class="category-empty-msg">저장된 문장이 없습니다.</div>`;
            } else if(allWords.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; color:var(--text-sub); margin-top: 80px; font-size:14px; line-height:1.7;">
                        <div style="font-weight:700; color:var(--text-main); margin-bottom:6px;">아직 저장된 문장이 없어요</div>
                    </div>`;
            } else {
                container.innerHTML = `<p style="text-align:center; color:var(--text-sub); margin-top:40px; font-size:14px;">조건에 맞는 문장이 없습니다.</p>`;
            }
            return;
        }

        words.forEach(word => {
            const card = document.createElement('div');
            card.className = 'sentence-row';

            const linksToShow = (word.links && word.links.length > 0)
                ? (starOnlyLinks ? word.links.filter(l => l.starred === true) : word.links)
                : [];

            const wordKoreanHtml = highlightMatch(word.korean, highlightTerm);
            const wordEnglishHtml = highlightMatch(word.english, highlightTerm);

            let linksHtml = '';
            if(linksToShow.length > 0) {
                linksHtml = `<div class="link-list">`;
                linksToShow.forEach(link => {
                    const linkKoreanHtml = highlightMatch(link.korean, highlightTerm);
                    const linkEnglishHtml = highlightMatch(link.english, highlightTerm);
                    linksHtml += `
                        <div class="link-row" id="link-item-${word.id}-${link.createdAt}">
                            <div class="sentence-text-wrap">
                                <div class="sentence-kr-row">
                                    ${link.starred === true ? '<i class="fa-solid fa-star sentence-star" style="font-size:10px;"></i>' : ''}
                                    <div class="sentence-kr" style="font-size:14px;">${linkKoreanHtml}</div>
                                </div>
                                <div class="sentence-en" id="link-en-${word.id}-${link.createdAt}" style="font-size:13px;">${linkEnglishHtml}</div>
                            </div>
                        </div>`;
                });
                linksHtml += `</div>`;
            }

            card.innerHTML = `
                <div class="sentence-main">
                    <div class="sentence-text-wrap">
                        <div class="sentence-kr-row">
                            ${word.starred === true ? '<i class="fa-solid fa-star sentence-star"></i>' : ''}
                            <div class="sentence-kr">${wordKoreanHtml}</div>
                        </div>
                        <div class="sentence-en" id="en-box-${word.id}">${wordEnglishHtml}</div>
                        ${linksHtml}
                    </div>
                    <div class="sentence-actions">
                        <i class="fa-solid fa-plus" id="add-link-${word.id}" title="연결문장 추가"></i>
                    </div>
                </div>
            `;

            container.appendChild(card);

            // 영어 문장 탭/클릭 → 발음 재생
            card.querySelector(`#en-box-${word.id}`).addEventListener('click', (e) => { e.stopPropagation(); speak(word.english); });

            // 롱프레스(모바일) / 우클릭(노트북) → 문장 관리(수정) 탭 열기
            attachCardMenuTrigger(card, () => openEditModal(word));

            if(linksToShow.length > 0) {
                linksToShow.forEach(link => {
                    const linkEnEl = card.querySelector(`#link-en-${word.id}-${link.createdAt}`);
                    if(linkEnEl) linkEnEl.addEventListener('click', (e) => { e.stopPropagation(); speak(link.english); });

                    const linkRowEl = card.querySelector(`#link-item-${word.id}-${link.createdAt}`);
                    if(linkRowEl) attachCardMenuTrigger(linkRowEl, () => openLinkEditModal(word.id, link.createdAt));
                });
            }

            const addLinkBtn = card.querySelector(`#add-link-${word.id}`);
            addLinkBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('link-parent-id').value = word.id;
                document.getElementById('link-korean').value = '';
                document.getElementById('link-english').value = '';
                linkModal.style.display = 'flex';
            });
        });
    }

    // ── 카드 롱프레스(모바일)/우클릭(노트북) 공용 트리거 ──
    // 짧게 탭/클릭하면 아무 일도 없고, 일정 시간 이상 누르고 있거나 우클릭하면 콜백 실행
    function attachCardMenuTrigger(el, openFn) {
        let pressTimer = null;
        let longPressFired = false;

        el.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            longPressFired = false;
            pressTimer = setTimeout(() => {
                longPressFired = true;
                openFn();
            }, 500);
        }, { passive: true });

        el.addEventListener('touchend', (e) => {
            clearTimeout(pressTimer);
            if(longPressFired) e.preventDefault();
        }, { passive: false });

        el.addEventListener('touchmove', () => clearTimeout(pressTimer), { passive: true });

        el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            openFn();
        });
    }

    // ── 문장 수정 모달 - 즐겨찾기 토글 버튼 ──
    function updateEditStarBtn(isStarred) {
        const btn = document.getElementById('edit-star-btn');
        btn.className = isStarred ? 'fa-solid fa-star' : 'fa-regular fa-star';
        btn.style.color = isStarred ? '#ffca28' : 'var(--text-sub)';
    }

    document.getElementById('edit-star-btn').addEventListener('click', () => {
        const id = document.getElementById('edit-word-id').value;
        const word = allWords.find(w => w.id === id);
        if(!word) return;
        word.starred = !word.starred;
        saveData();
        refreshFromStorage();
        updateEditStarBtn(word.starred === true);
    });

    // ── 연결 문장 수정 모달 - 즐겨찾기 토글 버튼 ──
    function updateLinkEditStarBtn(isStarred) {
        const btn = document.getElementById('link-edit-star-btn');
        btn.className = isStarred ? 'fa-solid fa-star' : 'fa-regular fa-star';
        btn.style.color = isStarred ? '#ffca28' : 'var(--text-sub)';
    }

    function openLinkEditModal(wordId, linkCreatedAt) {
        const word = allWords.find(w => w.id === wordId);
        if(!word) return;
        const link = (word.links || []).find(l => l.createdAt === linkCreatedAt);
        if(!link) return;
        document.getElementById('link-edit-parent-id').value = wordId;
        document.getElementById('link-edit-created-at').value = linkCreatedAt;
        document.getElementById('link-edit-korean').value = link.korean;
        document.getElementById('link-edit-english').value = link.english;
        updateLinkEditStarBtn(link.starred === true);
        document.getElementById('link-edit-modal').style.display = 'flex';
    }

    document.getElementById('link-edit-star-btn').addEventListener('click', () => {
        const wordId = document.getElementById('link-edit-parent-id').value;
        const createdAt = parseInt(document.getElementById('link-edit-created-at').value);
        const word = allWords.find(w => w.id === wordId);
        if(!word) return;
        const link = (word.links || []).find(l => l.createdAt === createdAt);
        if(!link) return;
        link.starred = !link.starred;
        saveData();
        refreshFromStorage();
        updateLinkEditStarBtn(link.starred === true);
    });

    // 카테고리 <select> 옵션 채우기 (새 문장 추가 / 문장 수정 모달)
    function populateCategorySelects() {
        const cats = getCategoriesOrdered();
        const optionsHtml = cats.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
        const inputSel = document.getElementById('input-category');
        const editSel = document.getElementById('edit-category');
        const prevInputVal = inputSel.value;
        const prevEditVal = editSel.value;
        inputSel.innerHTML = optionsHtml;
        editSel.innerHTML = optionsHtml;
        if(cats.some(c => c.id === prevInputVal)) inputSel.value = prevInputVal;
        if(cats.some(c => c.id === prevEditVal)) editSel.value = prevEditVal;
    }

    // ── 설정 탭: 내보내기(Excel / PDF) ──

    // 내보내기 카테고리 <select> 옵션 채우기 ('전체 카테고리' + 개별 카테고리)
    function populateExportCategorySelect() {
        const sel = document.getElementById('export-category-select');
        if(!sel) return;
        const cats = getCategoriesOrdered();
        const prevVal = sel.value;
        sel.innerHTML = '<option value="all">전체 카테고리</option>'
            + cats.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
        if(prevVal === 'all' || cats.some(c => c.id === prevVal)) sel.value = prevVal;
    }

    // 선택된 카테고리 기준으로 내보낼 문장 목록을 [{korean, english}] 형태로 평탄화
    // (본문장 + 연관문장을 등록 순서대로 모두 포함)
    function getExportSentences(categoryId) {
        const src = categoryId === 'all' ? allWords : allWords.filter(w => w.categoryId === categoryId);
        const sorted = src.slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        const rows = [];
        sorted.forEach(w => {
            rows.push({ korean: w.korean, english: w.english });
            (w.links || []).slice().sort((a, b) => a.createdAt - b.createdAt).forEach(l => {
                rows.push({ korean: l.korean, english: l.english });
            });
        });
        return rows;
    }

    function exportFileDateStamp() {
        const d = new Date();
        return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    }

    function getSelectedExportLabel() {
        const categoryId = document.getElementById('export-category-select').value;
        return categoryId === 'all' ? '전체' : getCategoryName(categoryId);
    }

    // Excel(.xlsx) 내보내기: PDF 학습지와 비슷한 느낌으로 제목행 + 헤더행 + 테두리 있는 표를 만들어 다운로드
    // 시트 1: 한국어+영어 모두 채워진 정답 시트 / 시트 2: 한국어만 있고 영어 칸이 빈 연습 시트
    const EXCEL_GRID_BORDER = {
        top: { style: 'thin', color: { argb: 'FF333333' } },
        left: { style: 'thin', color: { argb: 'FF333333' } },
        bottom: { style: 'thin', color: { argb: 'FF333333' } },
        right: { style: 'thin', color: { argb: 'FF333333' } }
    };

    // 워크북에 한 개의 정답/연습 시트를 만들어 채워 넣음 (withEnglish=false면 영어 칸을 비움)
    function buildExcelSheet(wb, sheetName, rows, label, withEnglish) {
        const ws = wb.addWorksheet(sheetName.slice(0, 31), {
            views: [{ state: 'frozen', ySplit: 2 }],
            pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
        });
        ws.columns = [{ width: 48 }, { width: 48 }];

        // 제목 행 (PDF의 페이지 제목과 동일한 문구)
        ws.mergeCells('A1:B1');
        const titleRow = ws.getRow(1);
        titleRow.height = 28;
        ['A1', 'B1'].forEach(addr => {
            const cell = ws.getCell(addr);
            cell.border = { bottom: { style: 'medium', color: { argb: 'FF1C1C1E' } } };
        });
        const titleCell = ws.getCell('A1');
        titleCell.value = `영어 학습 노트 / ${label}`;
        titleCell.font = { name: 'Pretendard', size: 14, bold: true, color: { argb: 'FF1C1C1E' } };
        titleCell.alignment = { vertical: 'middle', horizontal: 'left' };

        // 헤더 행 (한국어 / 영어)
        const headerRow = ws.addRow(['한국어', '영어']);
        headerRow.height = 20;
        headerRow.eachCell(cell => {
            cell.font = { name: 'Pretendard', bold: true, size: 11, color: { argb: 'FF1C1C1E' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F1EE' } };
            cell.alignment = { vertical: 'middle', horizontal: 'left' };
            cell.border = EXCEL_GRID_BORDER;
        });

        // 문장 행
        rows.forEach(r => {
            const row = ws.addRow([r.korean, withEnglish ? r.english : '']);
            row.height = 26;
            row.eachCell((cell, colNumber) => {
                cell.font = colNumber === 1
                    ? { name: 'Pretendard', size: 11, bold: true, color: { argb: 'FF1C1C1E' } }
                    : { name: 'IBM Plex Sans', size: 11, color: { argb: 'FF1C1C1E' } };
                cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
                cell.border = EXCEL_GRID_BORDER;
            });
        });

        return ws;
    }

    async function exportToExcel() {
        const categoryId = document.getElementById('export-category-select').value;
        const rows = getExportSentences(categoryId);
        if(rows.length === 0) { showInlineToast('⚠️', '내보낼 문장이 없어요'); return; }
        if(typeof ExcelJS === 'undefined') { alert('엑셀 내보내기 기능을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도해주세요.'); return; }

        const label = getSelectedExportLabel();
        const wb = new ExcelJS.Workbook();
        buildExcelSheet(wb, '정답', rows, label, true);
        buildExcelSheet(wb, '연습', rows, label, false);

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `enclip_${label}_${exportFileDateStamp()}.xlsx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showInlineToast('📊', '엑셀 파일을 내보냈어요');
    }

    // PDF 학습지 한 페이지 분량의 행(row) HTML 생성. withEnglish=false면 영어 칸을 비워서 연습용으로 만듦
    function buildPdfRowsHtml(chunk, withEnglish) {
        return chunk.map(r => `
            <div class="pdf-row">
                <div class="pdf-cell pdf-cell-kr">${escapeHtml(r.korean)}</div>
                <div class="pdf-cell pdf-cell-en${withEnglish ? '' : ' blank'}">${withEnglish ? escapeHtml(r.english) : ''}</div>
            </div>`).join('');
    }

    function buildPdfPageHtml(chunk, withEnglish, catLabel, pageNum, totalPages) {
        return `
            <div class="pdf-page">
                <div class="pdf-page-header">
                    <div class="pdf-page-title">영어 학습 노트 / ${escapeHtml(catLabel)}</div>
                    <div class="pdf-page-sub">${pageNum} / ${totalPages}</div>
                </div>
                <div class="pdf-grid">
                    <div class="pdf-row pdf-head-row">
                        <div class="pdf-cell pdf-cell-kr">한국어</div>
                        <div class="pdf-cell pdf-cell-en">영어</div>
                    </div>
                    <div class="pdf-body">
                        ${buildPdfRowsHtml(chunk, withEnglish)}
                    </div>
                </div>
            </div>`;
    }

    // 배열을 size개씩 잘라 페이지 단위 청크로 분리
    function chunkArray(arr, size) {
        const out = [];
        for(let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
        return out;
    }

    const PDF_ROWS_PER_PAGE = 16;

    // 인쇄용 A4 학습지 전체 HTML 문서 생성
    // 1부: 한국어+영어가 모두 채워진 정답 페이지 → 2부: 한국어만 있고 영어 칸이 빈 연습 페이지가 이어짐
    function buildPdfDocumentHtml(rows, catLabel) {
        const chunks = chunkArray(rows, PDF_ROWS_PER_PAGE);
        const totalPages = chunks.length * 2;
        let pageNum = 0;
        const answerPages = chunks.map(chunk => {
            pageNum++;
            return buildPdfPageHtml(chunk, true, catLabel, pageNum, totalPages);
        }).join('');
        const practicePages = chunks.map(chunk => {
            pageNum++;
            return buildPdfPageHtml(chunk, false, catLabel, pageNum, totalPages);
        }).join('');

        return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>enclip 학습 노트 - ${escapeHtml(catLabel)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif; color: #1C1C1E; background: #fff; }
    @page { size: A4; margin: 0; }
    .pdf-page { width: 210mm; min-height: 297mm; padding: 16mm 14mm; page-break-after: always; display: flex; flex-direction: column; }
    .pdf-page:last-child { page-break-after: auto; }
    .pdf-page-header { margin-bottom: 6mm; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #1C1C1E; padding-bottom: 3mm; }
    .pdf-page-title { font-size: 13px; font-weight: 700; }
    .pdf-page-sub { font-size: 11px; color: #666; white-space: nowrap; }
    .pdf-grid { display: block; border: 1px solid #333; }
    .pdf-body { display: block; }
    .pdf-row { display: flex; border-bottom: 1px solid #333; min-height: 14.5mm; }
    .pdf-head-row { background: #f2f1ee; font-weight: 700; font-size: 11px; min-height: 0; }
    .pdf-cell { flex: 1; padding: 3mm 4mm; display: flex; align-items: center; font-size: 12.5px; line-height: 1.5; word-break: keep-all; overflow-wrap: break-word; }
    .pdf-cell-kr { border-right: 1px solid #333; font-weight: 600; }
    .pdf-cell-en { font-family: "IBM Plex Sans", sans-serif; font-weight: 400; }
    @media screen {
        body { background: #888; padding: 10mm 0; }
        .pdf-page { margin: 0 auto 10mm; box-shadow: 0 0 12px rgba(0,0,0,0.25); background: #fff; }
    }
</style>
</head>
<body>
${answerPages}
${practicePages}
<script>
    function triggerPrint() { setTimeout(function(){ window.print(); }, 250); }
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(triggerPrint); }
    else { triggerPrint(); }
<\/script>
</body>
</html>`;
    }

    // PDF 내보내기: 인쇄 전용 창을 열어 브라우저의 '인쇄 > PDF로 저장'으로 A4 학습지를 만들 수 있게 함
    function exportToPdf() {
        const categoryId = document.getElementById('export-category-select').value;
        const rows = getExportSentences(categoryId);
        if(rows.length === 0) { showInlineToast('⚠️', '내보낼 문장이 없어요'); return; }

        const catLabel = getSelectedExportLabel();
        const html = buildPdfDocumentHtml(rows, catLabel);
        const printWin = window.open('', '_blank');
        if(!printWin) { alert('팝업이 차단되어 PDF 학습지를 열 수 없어요. 브라우저에서 팝업 허용 후 다시 시도해주세요.'); return; }
        printWin.document.open();
        printWin.document.write(html);
        printWin.document.close();
    }

    document.getElementById('btn-export-excel').addEventListener('click', exportToExcel);
    document.getElementById('btn-export-pdf').addEventListener('click', exportToPdf);

    function openEditModal(word) {
        document.getElementById('edit-word-id').value = word.id;
        document.getElementById('edit-korean').value = word.korean;
        document.getElementById('edit-english').value = word.english;
        populateCategorySelects();
        document.getElementById('edit-category').value = word.categoryId || (allCategories[0] ? allCategories[0].id : '');
        updateEditStarBtn(word.starred === true);
        editModal.style.display = 'flex';
    }

    document.getElementById('btn-edit-submit').addEventListener('click', () => {
        const id = document.getElementById('edit-word-id').value;
        const uKorean = document.getElementById('edit-korean').value.trim();
        const uEnglish = document.getElementById('edit-english').value.trim();
        const uCategory = document.getElementById('edit-category').value || (allCategories[0] ? allCategories[0].id : '');
        if(!uKorean || !uEnglish) return alert("내용을 채워주세요.");
        const target = allWords.find(w => w.id === id);

    });

    document.getElementById('btn-edit-delete').addEventListener('click', () => {
        const id = document.getElementById('edit-word-id').value;
        allWords = allWords.filter(w => w.id !== id);
        saveData();
        refreshFromStorage();
        editModal.style.display = 'none';
    });

    document.getElementById('btn-save-word').addEventListener('click', () => {
        const korean = document.getElementById('input-korean').value.trim();
        const english = document.getElementById('input-english').value.trim();
        const categoryId = document.getElementById('input-category').value || (allCategories[0] ? allCategories[0].id : '');

            id: generateId(),
            korean: korean,
            english: english,

            starred: false,

        };
        allWords.unshift(newWord);
        lastUsedCategoryId = categoryId;
        saveData();
        refreshFromStorage();

        document.getElementById('input-korean').value = '';
        document.getElementById('input-english').value = '';
        document.getElementById('input-korean').focus();
    });

    document.getElementById('btn-save-link').addEventListener('click', () => {
        const parentId = document.getElementById('link-parent-id').value;
        const lKorean = document.getElementById('link-korean').value.trim();
        const lEnglish = document.getElementById('link-english').value.trim();

        if(!lKorean || !lEnglish) return alert("내용을 입력해 주세요.");

        const parentWord = allWords.find(w => w.id === parentId);
        if(!parentWord) return;
        if(!parentWord.links) parentWord.links = [];
        parentWord.links.push({ korean: lKorean, english: lEnglish, createdAt: new Date().getTime(), inFlashcard: true, starred: false });
        saveData();
        refreshFromStorage();
        linkModal.style.display = 'none';
    });

    // ── 설정 탭: 카테고리 관리 ──
    function renderCategoryManageList() {
        const wrap = document.getElementById('category-manage-list');
        if(!wrap) return;
        wrap.innerHTML = '';
        const isOnlyCategory = allCategories.length <= 1;
        getCategoriesOrdered().forEach(cat => {
            const words = allWords.filter(w => w.categoryId === cat.id);
            const row = document.createElement('div');
            row.className = 'cat-manage-row';
            row.innerHTML = `
                <div class="cat-manage-left">
                    <span class="cat-manage-name">${escapeHtml(cat.name)}</span>
                    <span class="cat-manage-count">(${totalCardCount(words)})</span>
                </div>
                <div class="cat-manage-actions">
                    <i class="fa-solid fa-pen" data-action="rename"></i>
                    <i class="fa-solid fa-trash ${isOnlyCategory ? 'disabled' : ''}" data-action="delete"></i>
                </div>
            `;
            wrap.appendChild(row);
            row.querySelector('[data-action="rename"]').addEventListener('click', () => openCategoryFormModal(cat));

                row.querySelector('[data-action="delete"]').addEventListener('click', () => deleteCategory(cat));
            }
