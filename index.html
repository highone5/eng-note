    function openCategoryFormModal(cat) {
        document.getElementById('category-form-title').innerText = cat ? '카테고리 이름 변경' : '새 카테고리';
        document.getElementById('category-form-id').value = cat ? cat.id : '';
        document.getElementById('category-form-name').value = cat ? cat.name : '';
        document.getElementById('category-form-modal').style.display = 'flex';
    }
    document.getElementById('btn-add-category').addEventListener('click', () => openCategoryFormModal(null));
    document.getElementById('close-category-form-modal').addEventListener('click', () => document.getElementById('category-form-modal').style.display = 'none');

    document.getElementById('btn-category-form-save').addEventListener('click', () => {
        const id = document.getElementById('category-form-id').value;
        const name = document.getElementById('category-form-name').value.trim();
        if(!name) return alert('카테고리 이름을 입력해 주세요.');
        if(id) {
            const cat = allCategories.find(c => c.id === id);
            if(cat) cat.name = name;
        } else {
            allCategories.push({ id: generateCategoryId(), name });
        }
        saveData();
        refreshFromStorage();
        document.getElementById('category-form-modal').style.display = 'none';
    });

    function deleteCategory(cat) {
        if(allCategories.length <= 1) {
            alert('마지막 남은 카테고리는 삭제할 수 없습니다.');
            return;
        }
        if(!confirm(`'${cat.name}' 카테고리를 삭제할까요? 저장된 문장은 다른 카테고리로 이동됩니다.`)) return;
        const remaining = allCategories.filter(c => c.id !== cat.id);
        const fallbackId = remaining[0].id;
        allWords.forEach(w => { if(w.categoryId === cat.id) w.categoryId = fallbackId; });
        allCategories = remaining;
        openCategoryIds.delete(cat.id);
        saveData();
        refreshFromStorage();
    }

    // ── 플래시카드 ──

    // 현재 선택된 스코프(전체/오늘/즐겨찾기)에 해당하는 원본 문장 목록 (최신순, 카테고리 무관)
    function getScopeWords(value) {
        if(value === 'star') {
            return allWords.filter(w => w.starred === true || (w.links && w.links.some(l => l.starred === true))).sort(byNewest);
        }
        if(value === 'today') {
            const todayStr = new Date().toDateString();
            return allWords.filter(w => w.createdAt && parseDate(w.createdAt).toDateString() === todayStr).sort(byNewest);
        }
        return [...allWords].sort(byNewest);
    }

    // 현재 플래시카드 모드(스코프 또는 카테고리)에 맞는 원본 문장 목록
    function getWordsForFcMode() {
        if(fcMode.type === 'category') {
            return allWords.filter(w => w.categoryId === fcMode.id).sort(byNewest);
        }
        return getScopeWords(fcMode.value);
    }

    function updateFcModeLabel() {
        const label = document.getElementById('fc-mode-label');
        if(fcMode.type === 'category') {
            label.innerText = getCategoryName(fcMode.id);
        } else {
            label.innerText = { all: '전체', today: '오늘', star: '즐겨찾기' }[fcMode.value] || '전체';
        }
    }

    function resetFcMode() {
        fcMode = { type: 'scope', value: 'all' };
        updateFcModeLabel();
    }

    // 현재 모드에 맞는 플래시카드 풀 구성. forceShuffle이 true면 무작위로 섞음 (셔플 버튼용)
    function buildPoolForCurrentSelection(forceShuffle) {
        const baseWords = getWordsForFcMode();
        const starFilterMode = (fcMode.type === 'scope' && fcMode.value === 'star');
        let pool = buildFlashcardPool(baseWords, starFilterMode);

        if(forceShuffle) {
            // Fisher-Yates 셔플
            for(let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
        }
        return pool;
    }

    // 이미 구성된 카드 풀을 바로 로드 (모드 변경 시 사용)
    function loadFlashcardPool(pool) {
        flashcardPool = pool;
        currentFlashIndex = 0;
        isCardRevealed = false;
        flashcardResults = {};
        showFlashcard();
    }

    // 카테고리 버튼 클릭 → 중앙 팝업으로 카테고리 목록 표시 (맨 윗줄에 전체/즐겨찾기 포함)
    document.getElementById('fc-btn-category').addEventListener('click', (e) => {
        e.stopPropagation();
        openFcCategoryModal();
    });

    function openFcCategoryModal() {
        const listEl = document.getElementById('fc-category-list');
        listEl.innerHTML = '';

        // 맨 윗줄: 즐겨찾기
        const starWords = getScopeWords('star');
        const starItem = document.createElement('div');
        starItem.className = 'fc-category-item' + (fcMode.type === 'scope' && fcMode.value === 'star' ? ' active' : '');
        const starCardCount = starWords.reduce((sum, w) => sum + (w.starred ? 1 : 0) + (w.links ? w.links.filter(l => l.starred).length : 0), 0);
        starItem.innerHTML = `<span>즐겨찾기</span><span class="fc-category-item-count">${starCardCount}</span>`;
        starItem.addEventListener('click', () => {
            if(starWords.length === 0) {
                showInlineToast('⭐', '즐겨찾기한 문장이 없습니다!');
                return;
            }
            fcMode = { type: 'scope', value: 'star' };
            updateFcModeLabel();
            document.getElementById('fc-category-modal').style.display = 'none';
            loadFlashcardPool(buildPoolForCurrentSelection(false));
        });
        listEl.appendChild(starItem);

        getCategoriesOrdered().forEach(cat => {
            const words = allWords.filter(w => w.categoryId === cat.id);
            const item = document.createElement('div');
            item.className = 'fc-category-item' + (fcMode.type === 'category' && fcMode.id === cat.id ? ' active' : '');
            item.innerHTML = `<span>${escapeHtml(cat.name)}</span><span class="fc-category-item-count">${totalCardCount(words)}</span>`;
            item.addEventListener('click', () => {
                if(words.length === 0) {
                    showInlineToast('📭', '저장된 문장이 없는 카테고리입니다!');
                    return;
                }
                fcMode = { type: 'category', id: cat.id };
                updateFcModeLabel();
                document.getElementById('fc-category-modal').style.display = 'none';
                loadFlashcardPool(buildPoolForCurrentSelection(false));
            });
            listEl.appendChild(item);
        });
        document.getElementById('fc-category-modal').style.display = 'flex';
    }
    document.getElementById('close-fc-category-modal').addEventListener('click', () => {
        document.getElementById('fc-category-modal').style.display = 'none';
    });

    function buildFlashcardPool(sourceArray, starFilterMode) {
        const pool = [];
        sourceArray.forEach(word => {
            if(!starFilterMode || word.starred === true) {
                pool.push({ id: word.id, korean: word.korean, english: word.english, starred: word.starred });
            }
            if(word.links && word.links.length > 0) {
                word.links.forEach(link => {
                    if(link.inFlashcard === false) return;
                    if(starFilterMode && link.starred !== true) return;
                    pool.push({ id: word.id + '_link_' + link.createdAt, korean: link.korean, english: link.english, starred: link.starred, isLink: true });
                });
            }
        });
        return pool;
    }

    function showFlashcard() {
        const koreanEl = document.getElementById('fc-korean');
        const englishEl = document.getElementById('fc-english');
        const progEl = document.getElementById('fc-progress');
        const playBtn = document.getElementById('fc-btn-audio');

        if(flashcardPool.length === 0) {
            koreanEl.innerHTML = "저장된 문장이 없습니다. 홈에서 추가해 보세요!";
            englishEl.innerText = '';
            progEl.innerText = "0 / 0";
            playBtn.style.visibility = 'hidden';
            return;
        }

        playBtn.style.visibility = 'visible';
        const currentWord = flashcardPool[currentFlashIndex];
        progEl.innerText = `${currentFlashIndex + 1} / ${flashcardPool.length}`;
        koreanEl.innerText = currentWord.korean;
        englishEl.innerText = isCardRevealed ? currentWord.english : '';
    }

    // 카드 탭 → 영어 문장 표시/숨김 토글 (재생 버튼 클릭은 제외)
    document.getElementById('flashcard-box').addEventListener('click', (e) => {
        if(e.target.id === 'fc-btn-audio' || e.target.closest('#fc-btn-audio')) return;
        if(flashcardPool.length === 0 || currentFlashIndex >= flashcardPool.length) return;
        isCardRevealed = !isCardRevealed;
        showFlashcard();
    });

    document.getElementById('fc-btn-audio').addEventListener('click', (e) => { e.stopPropagation(); if(flashcardPool[currentFlashIndex]) speak(flashcardPool[currentFlashIndex].english); });

    // 스와이프/방향키 채점 시 카드 위에 잠깐 체크/X 아이콘을 보여주는 시각 피드백
    function flashSwipeIndicator(status) {
        const el = document.getElementById('fc-swipe-indicator');
        if(!el) return;
        const icon = el.querySelector('i');
        if(status === 'known') {
            el.className = 'fc-swipe-indicator right';
            icon.className = 'fa-solid fa-check';
        } else {
            el.className = 'fc-swipe-indicator left';
            icon.className = 'fa-solid fa-xmark';
        }
        el.style.opacity = '1';
        clearTimeout(el._hideTimer);
        el._hideTimer = setTimeout(() => { el.style.opacity = '0'; }, 220);
    }

    // 현재 카드의 암기 여부를 기록하고 다음 카드로 이동 (스와이프/방향키에서 호출). 마지막 카드면 결과창 표시
    function markCurrentCard(status, btnId) {
        if(flashcardPool.length === 0 || currentFlashIndex >= flashcardPool.length) return;
        if(btnId) triggerBtnFlash(btnId);
        flashSwipeIndicator(status);
        const currentCard = flashcardPool[currentFlashIndex];
        flashcardResults[currentCard.id] = status;

        if(currentFlashIndex < flashcardPool.length - 1) {
            currentFlashIndex++;
            isCardRevealed = false;
            showFlashcard();
        } else {
            showFcResultModal();
        }
    }

    // 학습 완료 결과창: 처음부터 다시 / X 한 문장만 다시 선택 가능
    function showFcResultModal() {
        const total = flashcardPool.length;
        const knownCount = Object.values(flashcardResults).filter(v => v === 'known').length;
        const unknownCount = Object.values(flashcardResults).filter(v => v === 'unknown').length;

        document.getElementById('fc-result-score').innerText = `${knownCount} / ${total}`;
        document.getElementById('fc-result-detail').innerText = `체크 ${knownCount}개 · X ${unknownCount}개`;

        const retryBtn = document.getElementById('btn-fc-result-retry-wrong');
        retryBtn.style.display = unknownCount > 0 ? 'block' : 'none';

        document.getElementById('fc-result-modal').style.display = 'flex';
    }

    document.getElementById('btn-fc-result-restart-all').addEventListener('click', () => {
        document.getElementById('fc-result-modal').style.display = 'none';
        loadFlashcardPool(buildPoolForCurrentSelection(false));
    });

    document.getElementById('btn-fc-result-retry-wrong').addEventListener('click', () => {
        const wrongIds = new Set(Object.keys(flashcardResults).filter(id => flashcardResults[id] === 'unknown'));
        const retryPool = flashcardPool.filter(card => wrongIds.has(card.id));
        document.getElementById('fc-result-modal').style.display = 'none';
        if(retryPool.length === 0) return;
        loadFlashcardPool(retryPool);
    });

    document.getElementById('close-fc-result-modal').addEventListener('click', () => {
        document.getElementById('fc-result-modal').style.display = 'none';
    });

    // 랜덤 버튼 전용 일시적 플래시 효과
    function triggerBtnFlash(btnId) {
        const btn = document.getElementById(btnId);
        if(!btn) return;
        btn.classList.add('flash');
        setTimeout(() => {
            btn.classList.remove('flash');
        }, 280); // 0.28초 뒤 피드백 컬러 소멸
    }

    // [셔플] 버튼: 전체 문장(스코프) 선택 상태면 전체를 셔플, 카테고리 선택 상태면 그 카테고리만 셔플
    document.getElementById('fc-btn-shuffle').addEventListener('click', (e) => {
        e.stopPropagation();
        triggerBtnFlash('fc-btn-shuffle');

        const baseWords = getWordsForFcMode();
        if(baseWords.length === 0) return;

        isCardRevealed = false;
        loadFlashcardPool(buildPoolForCurrentSelection(true));
    });

    window.addEventListener('keydown', (e) => {
        if(!document.getElementById('tab-flashcard').classList.contains('active')) return;
        if(flashcardPool.length === 0) return;

        if(e.key === 'ArrowRight') {
            markCurrentCard('known');
        } else if(e.key === 'ArrowLeft') {
            markCurrentCard('unknown');
        } else if(e.key === ' ' || e.code === 'Space') {
            e.preventDefault(); 
            isCardRevealed = !isCardRevealed;
            showFlashcard();
        }
    });

    // 모바일 터치 스와이프 제어
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let isHorizontalSwipe = false;
    const cardZone = document.getElementById('flashcard-box');

    cardZone.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        isHorizontalSwipe = false;
    }, { passive: true });

    cardZone.addEventListener('touchmove', (e) => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        // 가로 이동이 세로 이동보다 뚜렷하면, 브라우저의 스와이프 제스처(뒤로가기 등)가
        // 가로채지 못하도록 기본 동작을 막고 우리 쪽 스와이프로 처리
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
            isHorizontalSwipe = true;
            e.preventDefault();
        }
    }, { passive: false });

    cardZone.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        if (isHorizontalSwipe) handleSwipeGesture();
    }, { passive: true });

    function handleSwipeGesture() {
        const threshold = 60;
        const swipedLeft = touchStartX - touchEndX > threshold;
        const swipedRight = touchEndX - touchStartX > threshold;

        if (swipedRight) {
            markCurrentCard('known');
        } else if (swipedLeft) {
            markCurrentCard('unknown');
        }
    }

    // 검색 필터 (카테고리 상관없이 전체 문장 대상)
    document.getElementById('search-input').addEventListener('input', () => {
        renderHome();
    });

    function showInlineToast(emoji, msg, duration = 2200) {
        const toast = document.getElementById('inline-toast');
        document.getElementById('inline-toast-emoji').innerText = emoji;
        document.getElementById('inline-toast-msg').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), duration);
    }

    // Firebase 준비되면 데이터 로드 후 앱 시작
    window.addEventListener('firebase-ready', async () => {
        const data = await loadDataFromFirebase();
        allWords = data.words;
        allCategories = data.categories || [];
        const migrated = ensureCategories();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ words: allWords, categories: allCategories })); } catch {}
        if(migrated) { await saveData(); }
        const overlay = document.getElementById('firebase-loading');
        overlay.classList.add('hide');
        setTimeout(() => overlay.style.display = 'none', 400);
        refreshFromStorage();
    });

    // 5초 안에 Firebase 안 되면 로컬로 시작
    setTimeout(async () => {
        const overlay = document.getElementById('firebase-loading');
        if (!overlay.classList.contains('hide')) {
            const data = loadDataFromLocalStorage();
            allWords = data.words;
            allCategories = data.categories || [];
            ensureCategories();
            overlay.classList.add('hide');
            setTimeout(() => overlay.style.display = 'none', 400);
            refreshFromStorage();
        }
    }, 5000);
</script>
</body>
